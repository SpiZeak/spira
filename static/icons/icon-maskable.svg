<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Full-bleed background. Maskable safe zone = inner circle r=204 centred at (256,256) -->
	<rect width="512" height="512" fill="#2a7a2d" />
	<!--
    Leaf fits within the maskable safe zone.
    Control points (268,92) / (244,92) are nearly vertical from the tip (256,68)
    creating a sharp pointed apex, not a rounded oval.
  -->
	<path d="M 256  68
           C 268  92, 424 158, 424 262
           C 424 368, 326 458, 256 466
           C 186 458,  88 368,  88 262
           C  88 158, 244  92, 256  68 Z" fill="#b9ddb9" />
	<!-- Petiole -->
	<line x1="256" y1="458" x2="256" y2="484" stroke="#b9ddb9" stroke-width="10" stroke-linecap="round" />
	<!-- Central vein -->
	<line x1="256" y1="90" x2="256" y2="455" stroke="#2a7a2d" stroke-width="12" stroke-linecap="round" />
	<!-- Upper vein pair -->
	<path d="M 256 188 Q 290 170 342 177" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
	<path d="M 256 188 Q 222 170 170 177" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
	<!-- Middle vein pair -->
	<path d="M 256 268 Q 300 250 364 260" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
	<path d="M 256 268 Q 212 250 148 260" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
	<!-- Lower vein pair -->
	<path d="M 256 352 Q 292 342 346 349" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
	<path d="M 256 352 Q 220 342 166 349" stroke="#2a7a2d" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>
