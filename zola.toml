# The URL the site will be built for
base_url = "https://spirabotanik.se"

title = "Spira"
description = "Din guide till krukväxternas vackra värld — lär dig odla, ta hand om och älska dina gröna vänner."

default_language = "sv"
minify_html = false
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml"]

[markdown]
lazy_async_image = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[[taxonomies]]
name = "tags"
feed = false

[extra]
author = "Spira"

[languages.en]
title = "Spira"
description = "Your guide to the beautiful world of houseplants — learn to grow, care for, and love your green friends."
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml"]

[[languages.en.taxonomies]]
name = "tags"
feed = false

